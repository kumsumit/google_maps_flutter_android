name: google_maps_flutter_android
description: Android implementation of the google_maps_flutter plugin.
repository: https://github.com/flutter/packages/tree/main/packages/google_maps_flutter/google_maps_flutter_android
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+maps%22
version: 2.21.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: google_maps_flutter
    platforms:
      android:
        package: io.flutter.plugins.googlemaps
        pluginClass: GoogleMapsPlugin
        dartPluginClass: GoogleMapsFlutterAndroid

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.1
  google_maps_flutter_platform_interface:
    git: https://github.com/kumsumit/google_maps_flutter_platform_interface.git
  meta: ^1.19.0
  stream_transform: ^2.0.0

dev_dependencies:
  async: ^2.13.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  mockito: ^5.8.0
  pigeon: ^29.0.8
  plugin_platform_interface: 
    git: https://github.com/kumsumit/plugin_platform_interface.git

topics:
  - google-maps
  - google-maps-flutter
  - map
